/* ===== 状态 ===== */
var idx=0,ans=[];
var vIntro=document.getElementById("v-intro"),vQuiz=document.getElementById("v-quiz"),vRes=document.getElementById("v-result");
function show(v){[vIntro,vQuiz,vRes].forEach(function(x){x.classList.remove("active")});v.classList.add("active");window.scrollTo(0,0)}
function startQuiz(){idx=0;ans=[];show(vQuiz);renderQ()}
function renderQ(){
 var q=ITEMS[idx],box=document.getElementById("qbox");
 box.classList.remove("slide");void box.offsetWidth;box.classList.add("slide");
 var h='<div class="qnum">第 '+String(idx+1).padStart(2,"0")+' 题</div><div class="qtext">'+q.t+'</div><div class="opts">';
 for(var i=0;i<4;i++){h+='<button class="opt'+(ans[idx]===i?" on":"")+'" data-v="'+i+'"><span class="dot"></span><span>'+q.o[i]+'</span></button>'}
 h+='</div>';box.innerHTML=h;
 box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){choose(this)}});
 document.getElementById("qidx").textContent=(idx+1)+" / "+ITEMS.length;
 document.getElementById("pbar").style.width=(idx/ITEMS.length*100)+"%";
 document.getElementById("btnBack").disabled=idx===0;
}
function choose(el){
 var v=parseInt(el.dataset.v,10);ans[idx]=v;
 el.parentNode.querySelectorAll(".opt").forEach(function(x){x.classList.remove("on")});
 el.classList.add("on");
 setTimeout(function(){
  if(idx<ITEMS.length-1){idx++;renderQ()}else{document.getElementById("pbar").style.width="100%";compute()}
 },190);
}
function goBack(){if(idx>0){idx--;renderQ()}}
/* ===== 计分 ===== */
function compute(){
 var sc={},mx={};
 CHARS.forEach(function(c){sc[c]=0;mx[c]=0});
 ITEMS.forEach(function(it){it.w.forEach(function(map){for(var k in map){mx[k]+=map[k]}})});
 ITEMS.forEach(function(it,i){var v=ans[i];if(v===undefined||v===null){return}var map=it.w[v];for(var k in map){sc[k]+=map[k]}});
 var order=CHARS.slice().sort(function(a,b){return sc[b]/mx[b]-sc[a]/mx[a]});
 renderResult(order,sc,mx);
}
/* ===== 结果 ===== */
function renderResult(order,sc,mx){
 var top=order[0],second=order[1];
 var T=CHAR_INFO[top],TT=REPORTS[top];
 var h='<div class="rhead"><div class="k">CONAN · 匹配结果</div><h2>你最像的角色是「'+T.name+'」</h2><p>'+T.tag+'</p></div>';
 h+='<div class="rcard"><div style="font-size:14px;font-weight:600;margin-bottom:12px">八位角色匹配度</div>';
 CHARS.forEach(function(c){var p=Math.round(sc[c]/mx[c]*100);
  h+='<div class="dimrow'+(c===top?" top":"")+'"><span class="nm">'+CHAR_INFO[c].name+'</span><span class="track"><i data-w="'+p+'"></i></span><span class="vl">'+p+'%</span></div>';
 });
 h+='<div class="tcoach">匹配度反映的是你的选择与每位角色处事方式的吻合程度。每个人都有复合气质,下面的完整报告属于你的「第一匹配」。</div></div>';
 h+='<div class="mirror"><span class="mname" style="color:'+CHAR_INFO[second].color+'">第二匹配 · '+CHAR_INFO[second].name+'</span><span class="mtag">'+CHAR_INFO[second].tag+'</span></div>';
 h+='<div class="rcard"><div class="typehead"><div class="tname" style="color:'+T.color+'">'+T.name+'</div><div class="ttag">'+T.tag+'</div></div>';
 TT.ps.forEach(function(sec){h+='<div class="sect"><h4>'+sec[0]+'</h4><p>'+sec[1]+'</p></div>'});
 h+='<div class="sect"><h4>给你的小贴士</h4><ul class="tadv">';
 TT.adv.forEach(function(a){h+='<li>'+a+'</li>'});
 h+='</ul></div>';
 h+='<div class="note">角色是镜子,不是印章。你的行为里会有不同角色的影子,这很正常——人的丰富,恰恰在于不止一种可能。</div></div>';
 h+='<div class="rhead" style="margin-top:22px"><button class="btn" onclick="location.reload()">重新测试</button></div>';
 h+='<p class="foot" style="text-align:center">本测试为粉丝向趣味内容,与官方无关;《名侦探柯南》角色及相关内容版权归原著方所有。</p>';
 document.getElementById("resultBody").innerHTML=h;
 show(vRes);
 setTimeout(function(){document.querySelectorAll(".track i").forEach(function(el){el.style.width=el.dataset.w+"%"})},60);
}
</script>
