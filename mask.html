      <div class="kicker">PERSONA · 社会面具</div>
      <h1>社会面具测试</h1>
      <p class="lead">你在同事面前、在家人面前、在深夜独处时,是同一个你吗?20 道情境题,找到你最习惯戴的那副面具,也为你量一量它的厚度——看见它,往往是摘下来一点的第一步。</p>
      <div class="chips">
        <span class="chip">20 道题</span>
        <span class="chip">约 4 分钟</span>
        <span class="chip">4 种面具鉴定</span>
        <span class="chip">面具厚度分析</span>
      </div>
      <ul class="list">
        <li>凭第一反应作答,选「你实际会做的」,不是「你觉得应该做的」</li>
        <li>面具不是缺点,它是我们适应社会的方式,关键是你是否察觉自己在戴</li>
        <li>结果包含面具厚度与类型报告,仅供自我探索参考</li>
      </ul>
      <button class="btn" onclick="startQuiz()">开始测试</button>
      <p class="foot">本测试为基于荣格「人格面具」概念的科普性原创自评,仅供自我认识参考,不构成心理诊断或专业建议。</p>
    </div>
  </section>

  </section>

  </section>

  o:["三天可见,发得极少","偶尔冒泡,只发值得一提的事","段子和美食,快乐代言人","温暖治愈,岁月静好"],
  w:[{tou:2},{qiang:2},{kai:2},{tao:2}],mi:[1,1,2,2]},
 {t:"和亲近的人吵架后,先低头破冰的是——",
  o:["我先发个沙雕表情包试探","谁错谁低头,不惯着","不管谁的错,先低头的是我","冷战到底,让时间解决"],
  w:[{kai:2},{qiang:2},{tao:2},{tou:2}],mi:[1,0,2,2]},
 {t:"一个人在家,情绪突然低落的深夜,你——",
  o:["翻聊天记录,复盘是不是自己哪句话说错了","刷搞笑视频,笑着笑着更空了","安静追剧打游戏,早就习惯了","把目标清单写一遍,明天继续战斗"],
  w:[{tao:2},{kai:2},{tou:2},{qiang:2}],mi:[2,1,0,1]},
 {t:"有人向你倾诉痛苦,但你自己也很累——",
  o:["打起精神,先稳稳接住对方","默默陪着,不太会说什么","「需要我做什么,直接说」","分享一个自己更惨的故事,用幽默安慰对方"],
  w:[{tao:2},{tou:2},{qiang:2},{kai:2}],mi:[2,1,0,1]},
 {t:"如果有一天,可以彻底不用「营业」——",
  o:["把「都行」改成所有真正的答案","安静待着,不用负责逗任何人笑","坦然承认「我也想被人接住一次」","大声说出一次自己的立场"],
  w:[{tao:2},{kai:2},{qiang:2},{tou:2}],mi:[0,0,0,0]}
];
/* ===== 状态 ===== */
var idx=0,ans=[];
var vIntro=document.getElementById("v-intro"),vQuiz=document.getElementById("v-quiz"),vRes=document.getElementById("v-result");
function show(v){[vIntro,vQuiz,vRes].forEach(function(x){x.classList.remove("active")});v.classList.add("active");window.scrollTo(0,0)}
function startQuiz(){idx=0;ans=[];show(vQuiz);renderQ()}
function renderQ(){
 var q=ITEMS[idx],box=document.getElementById("qbox");
 box.classList.remove("slide");void box.offsetWidth;box.classList.add("slide");
 var h='<div class="qnum">第 '+String(idx+1).padStart(2,"0")+' 题</div><div class="qtext">'+q.t+'</div><div class="opts">';
 for(var i=0;i<4;i++){h+='<button class="opt'+(ans[idx]===i?" on":"")+'" data-v="'+i+'"><span class="dot"></span><span>'+q.o[i]+'</span></button>'}
 h+='</div>';box.innerHTML=h;
 box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){choose(this)}});
 document.getElementById("qidx").textContent=(idx+1)+" / "+ITEMS.length;
 document.getElementById("pbar").style.width=(idx/ITEMS.length*100)+"%";
 document.getElementById("btnBack").disabled=idx===0;
}
function choose(el){
 var v=parseInt(el.dataset.v,10);ans[idx]=v;
 el.parentNode.querySelectorAll(".opt").forEach(function(x){x.classList.remove("on")});
 el.classList.add("on");
 setTimeout(function(){
  if(idx<ITEMS.length-1){idx++;renderQ()}else{document.getElementById("pbar").style.width="100%";compute()}
 },190);
}
function goBack(){if(idx>0){idx--;renderQ()}}
/* ===== 计分 ===== */
function compute(){
 var sc={},mx={};
 TYPES.forEach(function(c){sc[c]=0;mx[c]=0});
 ITEMS.forEach(function(it){it.w.forEach(function(map){for(var k in map){mx[k]+=map[k]}})});
 ITEMS.forEach(function(it,i){var v=ans[i];if(v===undefined||v===null){return}var map=it.w[v];for(var k in map){sc[k]+=map[k]}});
 var msum=0;
 ITEMS.forEach(function(it,i){var v=ans[i];if(v!==undefined&&v!==null){msum+=it.mi[v]}});
 var order=TYPES.slice().sort(function(a,b){return sc[b]/mx[b]-sc[a]/mx[a]});
 renderResult(order,sc,mx,msum);
}
/* ===== 结果 ===== */
function renderResult(order,sc,mx,msum){
 var top=order[0],second=order[1];
 var T=TYPE_INFO[top];
 var pct=Math.round(msum/(ITEMS.length*2)*100);
 var lv=LVS[pct<33?0:(pct<66?1:2)];
 var h='<div class="rhead"><div class="k">社会面具测试 · 鉴定结果</div><h2>你是「'+T.name+'」</h2><p>'+T.tag+'</p></div>';
 h+='<div class="rcard"><div style="font-size:14px;font-weight:600;margin-bottom:4px">面具厚度 · '+lv[0]+'</div>';
 h+='<div class="thickbar"><i data-w="'+pct+'"></i></div>';
 h+='<div class="dimrow"><span class="nm" style="width:74px">厚度值</span><span class="vl" style="width:52px;text-align:left;font-weight:700;color:var(--accent)">'+pct+'%</span></div>';
 h+='<p class="thickdesc">'+lv[1]+'</p></div>';
 h+='<div class="rcard"><div style="font-size:14px;font-weight:600;margin-bottom:12px">四种面具匹配度</div>';
 order.forEach(function(c){var p=Math.round(sc[c]/mx[c]*100);
  h+='<div class="dimrow'+(c===top?" top":"")+'"><span class="nm">'+TYPE_INFO[c].name+'</span><span class="track"><i data-w="'+p+'"></i></span><span class="vl">'+p+'%</span></div>';
 });
 h+='<div class="tcoach">占比越高,说明这副面具你戴得越熟练。它现在的样子,恰好是你保护过自己的方式。</div></div>';
 h+='<div class="mirror"><span class="mname" style="color:'+TYPE_INFO[second].color+'">第二面具 · '+TYPE_INFO[second].name+'</span><span class="mtag">'+TYPE_INFO[second].tag+'</span></div>';
 h+='<div class="rcard">';
 h+='<div class="typehead"><div class="tname" style="color:'+T.color+'">'+T.name+'</div><div class="ttag">'+T.tag+'</div></div>';
 T.report.forEach(function(sec){h+='<div class="sect"><h4>'+sec[0]+'</h4><p>'+sec[1]+'</p></div>'});
 h+='<div class="sect"><h4>什么时候可以摘下来一点</h4><ul class="tadv">';
 T.adv.forEach(function(a){h+='<li>'+a+'</li>'});
 h+='</ul></div>';
 h+='<div class="note">荣格把人在社会中呈现的样子称为「人格面具」(Persona):它不是虚伪,而是适应环境的正常功能。面具让你被接纳、被喜欢,但戴久了容易与自己失联——健康的做法不是扔掉面具,而是清楚地知道:自己什么时候在戴,什么时候可以摘。</div>';
 h+='</div>';
 h+='<div class="rhead" style="margin-top:22px"><button class="btn" onclick="location.reload()">重新测试</button></div>';
 h+='<p class="foot" style="text-align:center">本测试为科普性原创自评,仅供参考,不构成心理诊断或专业建议。</p>';
 document.getElementById("resultBody").innerHTML=h;
 show(vRes);
 setTimeout(function(){document.querySelectorAll(".track i,.thickbar i").forEach(function(el){el.style.width=el.dataset.w+"%"})},60);
}
</script>
</body>
</html>
